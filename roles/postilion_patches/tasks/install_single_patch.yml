---
# =============================================================================
# Install a single Postilion patch via AutoIt GUI automation
# Called from patch.yml in a loop — patch_item is the loop variable
#
# Idempotency: checks C:\Postilion\realtime for an installed marker matching
# the pattern "Realtime Framework_v5.6.00_Patch_NNN". Skips if found.
#
# Steps:
#   0. Check if patch is already installed (idempotency)
#   1. Extract the patch .exe (WinZip self-extractor)
#   2. Find setup.exe in the extracted directory
#   3. Generate AutoIt script for this patch
#   4. Create launcher script (starts setup.exe + AutoIt)
#   5. Run via scheduled task in interactive session
#   6. Wait for completion and check result
#   7. Clean up per-patch temp files
# =============================================================================

# --- Step 0: Extract patch number and check if already installed ---
- name: "{{ patch_item.filename }} — Extract patch number from filename"
  ansible.builtin.set_fact:
    patch_current_name: "{{ patch_item.filename }}"
    patch_current_path: "{{ patch_item.path }}"
    patch_current_basename: "{{ patch_item.filename | regex_replace('\\.exe$', '') }}"
    patch_number: "{{ patch_item.filename | regex_search('patch(\\d+)', '\\1') | first }}"
    patch_log_file: "{{ log_dir }}\\patch_autoit_{{ patch_item.filename | regex_replace('\\.exe$', '') }}.log"
  tags:
    - patch

- name: "{{ patch_item.filename }} — Check if patch {{ patch_number }} is already installed"
  ansible.windows.win_find:
    paths: "{{ postilion_install_dir }}\\realtime"
    patterns: "*Patch?{{ patch_number }}*"
    file_type: directory
  register: patch_installed_check
  tags:
    - patch

- name: "{{ patch_item.filename }} — Set installation status"
  ansible.builtin.set_fact:
    patch_already_installed: "{{ patch_installed_check.matched > 0 }}"
  tags:
    - patch

- name: "{{ patch_item.filename }} — Skip (already installed)"
  ansible.builtin.debug:
    msg: "Patch {{ patch_number }} is already installed at {{ postilion_install_dir }}\\realtime. Skipping."
  when: patch_already_installed | bool
  tags:
    - patch

# =============================================================================
# INSTALLATION BLOCK — only runs if patch is NOT already installed
# =============================================================================
- name: "{{ patch_item.filename }} — Display patch info"
  ansible.builtin.debug:
    msg: |
      ======================================================
      INSTALLING PATCH: {{ patch_current_name }}
      Patch number: {{ patch_number }}
      Source: {{ patch_current_path }}
      Log: {{ patch_log_file }}
      ======================================================
  when: not (patch_already_installed | bool)
  tags:
    - patch

# --- Step 1: Extract the patch (WinZip self-extractor) ---
- name: "{{ patch_item.filename }} — Check if patch is already extracted"
  ansible.windows.win_find:
    paths: "{{ postilion_patches_dir }}"
    patterns: "{{ patch_current_basename }}*"
    file_type: directory
  register: patch_extract_check
  when: not (patch_already_installed | bool)
  tags:
    - patch

- name: "{{ patch_item.filename }} — Extract patch (WinZip self-extractor)"
  ansible.windows.win_command: >
    "{{ patch_current_path }}" /auto "{{ postilion_patches_dir }}"
  register: patch_extraction_result
  when:
    - not (patch_already_installed | bool)
    - patch_extract_check.matched == 0
  timeout: 300
  tags:
    - patch

- name: "{{ patch_item.filename }} — Wait for extraction to complete"
  ansible.windows.win_find:
    paths: "{{ postilion_patches_dir }}"
    patterns: "{{ patch_current_basename }}*"
    file_type: directory
  register: patch_extracted_dir
  until: patch_extracted_dir.matched > 0
  retries: 30
  delay: 10
  when: not (patch_already_installed | bool)
  tags:
    - patch

- name: "{{ patch_item.filename }} — Set extracted directory path"
  ansible.builtin.set_fact:
    patch_extracted_path: "{{ patch_extracted_dir.files[0].path }}"
  when: not (patch_already_installed | bool)
  tags:
    - patch

# --- Step 2: Find setup.exe in extracted directory ---
- name: "{{ patch_item.filename }} — Find setup.exe"
  ansible.windows.win_find:
    paths: "{{ patch_extracted_path }}"
    patterns: "setup*.exe"
    file_type: file
    recurse: true
  register: patch_setup_search
  when: not (patch_already_installed | bool)
  tags:
    - patch

- name: "{{ patch_item.filename }} — Fail if setup.exe not found"
  ansible.builtin.fail:
    msg: "setup.exe not found in extracted patch directory {{ patch_extracted_path }}"
  when:
    - not (patch_already_installed | bool)
    - patch_setup_search.matched == 0
  tags:
    - patch

- name: "{{ patch_item.filename }} — Set setup.exe path"
  ansible.builtin.set_fact:
    patch_setup_exe: "{{ patch_setup_search.files[0].path }}"
  when: not (patch_already_installed | bool)
  tags:
    - patch

- name: "{{ patch_item.filename }} — Display setup.exe location"
  ansible.builtin.debug:
    msg: "Setup executable: {{ patch_setup_exe }}"
  when: not (patch_already_installed | bool)
  tags:
    - patch

# --- Step 3: Generate config INI for this patch ---
- name: "{{ patch_item.filename }} — Remove previous AutoIt patch log"
  ansible.windows.win_file:
    path: "{{ patch_log_file }}"
    state: absent
  when: not (patch_already_installed | bool)
  tags:
    - patch

- name: "{{ patch_item.filename }} — Generate patch config INI"
  ansible.windows.win_template:
    src: patch_config.ini.j2
    dest: "{{ temp_dir }}\\patch_config.ini"
  when: not (patch_already_installed | bool)
  tags:
    - patch

# --- Step 4: Create launcher script ---
- name: "{{ patch_item.filename }} — Create launcher script"
  ansible.windows.win_template:
    src: patch_launcher.ps1.j2
    dest: "{{ temp_dir }}\\patch_launcher.ps1"
  when: not (patch_already_installed | bool)
  tags:
    - patch

# --- Step 5: Run via scheduled task in interactive session ---
- name: "{{ patch_item.filename }} — Create and start scheduled task"
  ansible.windows.win_shell: |
    Unregister-ScheduledTask -TaskName "PostilionPatch" -Confirm:$false -ErrorAction SilentlyContinue
    $action = New-ScheduledTaskAction -Execute "powershell.exe" `
      -Argument "-NoProfile -ExecutionPolicy Bypass -File {{ temp_dir }}\patch_launcher.ps1"
    $principal = New-ScheduledTaskPrincipal -UserId "{{ ansible_user }}" `
      -LogonType Interactive -RunLevel Highest
    Register-ScheduledTask -TaskName "PostilionPatch" -Action $action -Principal $principal -Force
    Start-ScheduledTask -TaskName "PostilionPatch"
    Write-Output "Scheduled task PostilionPatch started for {{ patch_current_name }}"
  when: not (patch_already_installed | bool)
  tags:
    - patch

# --- Step 6: Wait for completion ---
- name: "{{ patch_item.filename }} — Wait for patch installation to complete"
  ansible.windows.win_shell: |
    $timeout = {{ postilion_patch_timeout }}
    $elapsed = 0
    while ($elapsed -lt $timeout) {
        $task = Get-ScheduledTask -TaskName "PostilionPatch" -ErrorAction SilentlyContinue
        if ($task -and $task.State -eq "Ready") {
            $info = Get-ScheduledTaskInfo -TaskName "PostilionPatch"
            Write-Output "Task completed. Last result: $($info.LastTaskResult)"
            $exitFile = "{{ temp_dir }}\patch_autoit_exitcode.txt"
            if (Test-Path $exitFile) {
                $exitCode = Get-Content $exitFile -Raw
                Write-Output "AutoIt exit code: $exitCode"
                if ($exitCode.Trim() -eq "0") {
                    exit 0
                } else {
                    exit [int]$exitCode.Trim()
                }
            }
            exit 0
        }
        Start-Sleep -Seconds 10
        $elapsed += 10
        if ($elapsed % 60 -eq 0) {
            Write-Output "Still waiting... ${elapsed}s elapsed (task state: $($task.State))"
        }
    }
    Write-Output "Timeout after ${timeout}s waiting for scheduled task"
    exit 1
  register: patch_autoit_result
  timeout: "{{ postilion_patch_timeout + 60 }}"
  failed_when: patch_autoit_result.rc != 0
  when: not (patch_already_installed | bool)
  tags:
    - patch

# --- Clean up scheduled task ---
- name: "{{ patch_item.filename }} — Remove scheduled task"
  ansible.windows.win_shell: |
    Unregister-ScheduledTask -TaskName "PostilionPatch" -Confirm:$false -ErrorAction SilentlyContinue
  when: not (patch_already_installed | bool)
  tags:
    - patch

# --- Retrieve log ---
- name: "{{ patch_item.filename }} — Read AutoIt patch log"
  ansible.windows.win_shell: |
    if (Test-Path "{{ patch_log_file }}") {
        Get-Content "{{ patch_log_file }}" -Tail 30
    } else {
        Write-Output "No AutoIt log file found"
    }
  register: patch_autoit_log
  when: not (patch_already_installed | bool)
  tags:
    - patch

- name: "{{ patch_item.filename }} — Display AutoIt log"
  ansible.builtin.debug:
    msg: "{{ patch_autoit_log.stdout_lines }}"
  when:
    - not (patch_already_installed | bool)
    - patch_autoit_log is defined
    - patch_autoit_log.stdout_lines | default([]) | length > 0
  tags:
    - patch

# --- Clean up per-patch temp files ---
- name: "{{ patch_item.filename }} — Clean up temp files"
  ansible.windows.win_file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ temp_dir }}\\patch_config.ini"
    - "{{ temp_dir }}\\patch_launcher.ps1"
    - "{{ temp_dir }}\\patch_autoit_exitcode.txt"
  when:
    - not (patch_already_installed | bool)
    - postilion_patch_cleanup | default(true)
  tags:
    - patch

- name: "{{ patch_item.filename }} — Patch complete"
  ansible.builtin.debug:
    msg: "Patch {{ patch_current_name }} (Patch {{ patch_number }}) installed successfully (exit code: {{ patch_autoit_result.rc }})"
  when: not (patch_already_installed | bool)
  tags:
    - patch
